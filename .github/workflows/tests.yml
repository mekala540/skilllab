name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Python 3.9 isn't available on Ubuntu 26.04 (ubuntu-latest); test it on 24.04.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -e . pytest
      # Free: every task is checked with its reference and shallow solutions; no model calls.
      - run: pytest -q
      - run: skilllab plan . --tier all
