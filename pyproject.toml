[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skilllab"
version = "0.3.0"
description = "Run a fixed task suite with and without an agent skill and report whether it actually helps."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mekala" }]
dependencies = []
keywords = ["ai-agents", "agent-skills", "claude-code", "benchmark", "evaluation", "token-savings"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/mekala540/skilllab"
Issues = "https://github.com/mekala540/skilllab/issues"
Results = "https://github.com/mekala540/skilllab/tree/main/docs/results"

[project.scripts]
skilllab = "skilllab.cli:main"

[tool.setuptools.packages.find]
include = ["skilllab*"]

[tool.setuptools.package-data]
skilllab = ["suite/**/*", "suite/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/solutions", "tests/shallow"]
